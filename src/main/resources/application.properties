# --- Aplicacion ---
spring.application.name=ecommerce

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# --- Base de datos H2 (en memoria) ---
spring.datasource.url=jdbc:h2:mem:ecommercedb
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# --- Consola web H2 ---
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# --- Datos ficticios de demostracion (desactivar en pruebas aisladas) ---
boheme.datos-iniciales.enabled=false

# JWT: secreto Base64 de al menos 32 bytes aleatorios, sin valor predeterminado.
boheme.jwt.secret=${BOHEME_JWT_SECRET:}
boheme.jwt.duration=${BOHEME_JWT_DURATION:PT1H}
